<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Вхід — Розклад операцій</title>
    <link rel="stylesheet" href="styles.css?v=20260916j" />
    <style>
      .login-error[hidden],
      .auth-panel[hidden],
      .auth-shared[hidden],
      #googleSignInWrap[hidden],
      #googleDivider[hidden]{display:none!important}
      .login-card{width:min(440px,100%)}
      .auth-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0 0 16px}
      .auth-tab{
        border:1px solid #cbd5e1;background:#f1f4f7;color:#315b7a;border-radius:10px;
        min-height:42px;font:inherit;font-weight:800;cursor:pointer;
      }
      .auth-tab.is-active{background:#17365d;border-color:#17365d;color:#fff}
      .auth-divider{
        display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;
        margin:14px 0;color:#718096;font-size:12px;font-weight:700;
      }
      .auth-divider::before,.auth-divider::after{content:"";height:1px;background:#dbe5ee}
      #googleSignInWrap{margin:0 0 4px}
      #googleSignIn{display:flex;justify-content:center;min-height:44px}
      .google-btn{
        width:100%;min-height:44px;border:1px solid #dadce0;border-radius:10px;background:#fff;
        color:#1f1f1f;font:inherit;font-size:14px;font-weight:700;cursor:pointer;
        display:inline-flex;align-items:center;justify-content:center;gap:10px;
      }
      .google-btn:hover{background:#f8f9fa}
      .google-btn svg{width:18px;height:18px;flex:0 0 auto}
      .show-password{display:flex!important;flex-direction:row!important;align-items:center;gap:8px;margin-top:8px}
      .show-password input{width:18px;min-height:18px!important}
      .auth-shared-toggle{
        margin-top:14px;border:0;background:transparent;color:#315b7a;font:inherit;font-size:13px;
        font-weight:700;cursor:pointer;padding:0;text-decoration:underline;
      }
      .auth-shared{margin-top:12px;padding-top:12px;border-top:1px solid #e2e8f0}
      .theme-dark .auth-tab{background:#1f2937;border-color:#4b5563;color:#9ac3e5}
      .theme-dark .auth-tab.is-active{background:#47759b;border-color:#47759b;color:#fff}
      .theme-dark .auth-divider::before,.theme-dark .auth-divider::after{background:#374151}
      .theme-dark .auth-shared{border-color:#374151}
      .theme-dark .auth-shared-toggle{color:#9ac3e5}
      .theme-dark .google-btn{background:#1f2937;border-color:#4b5563;color:#e5e7eb}
      .theme-dark .google-btn:hover{background:#243b53}
    </style>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <section class="login-screen">
      <div class="login-card">
        <p class="clinic-name">Національний науковий центр фтизіатрії, пульмонології і алергології ім. Ф.Г. Яновського НАМН України</p>
        <p class="eyebrow">Захищений доступ</p>
        <h1>Розклад операцій</h1>
        <p id="authLead">Увійдіть через Google або створіть акаунт.</p>

        <div id="googleSignInWrap" hidden>
          <div id="googleSignIn"></div>
          <button type="button" class="google-btn" id="googleFallbackBtn" hidden>
            <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C33.9 6.1 29.2 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.5-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19 12 24 12c3 0 5.8 1.1 7.9 3l5.7-5.7C33.9 6.1 29.2 4 24 4 16.1 4 9.3 8.5 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.5 26.7 36 24 36c-5.3 0-9.7-3.3-11.3-7.9l-6.5 5C9.2 39.5 16 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.6l.1.1 6.2 5.2C39.2 37.3 44 32 44 24c0-1.3-.1-2.5-.4-3.5z"/></svg>
            Увійти через Google
          </button>
        </div>
        <p class="auth-divider" id="googleDivider" hidden><span>або</span></p>

        <div class="auth-tabs" role="tablist">
          <button type="button" class="auth-tab" id="tabLogin" data-panel="loginPanel">Увійти</button>
          <button type="button" class="auth-tab is-active" id="tabRegister" data-panel="registerPanel">Реєстрація</button>
        </div>

        <form class="auth-panel" id="loginPanel" hidden>
          <label>Email<input id="loginEmail" type="email" autocomplete="username" placeholder="doctor@example.com" required /></label>
          <label>Пароль<input id="loginPassword" type="password" autocomplete="current-password" required /></label>
          <label class="show-password"><input id="showLoginPassword" type="checkbox" /> Показати пароль</label>
          <button class="primary" type="submit" id="loginSubmit">Увійти</button>
        </form>

        <form class="auth-panel" id="registerPanel">
          <label>ПІБ / імʼя<input id="registerName" type="text" autocomplete="name" placeholder="Прізвище І.Б." required /></label>
          <label>Email<input id="registerEmail" type="email" autocomplete="email" placeholder="doctor@example.com" required /></label>
          <label>Пароль<input id="registerPassword" type="password" autocomplete="new-password" minlength="8" required /></label>
          <label>Підтвердження пароля<input id="registerPassword2" type="password" autocomplete="new-password" minlength="8" required /></label>
          <label class="show-password"><input id="showRegisterPassword" type="checkbox" /> Показати пароль</label>
          <button class="primary" type="submit" id="registerSubmit">Створити акаунт</button>
        </form>

        <button type="button" class="auth-shared-toggle" id="sharedToggle" hidden>Вхід за паролем відділення</button>
        <form class="auth-shared" id="sharedPanel" hidden>
          <label>Пароль відділення<input id="accessPassword" type="password" autocomplete="current-password" /></label>
          <label class="show-password"><input id="showSharedPassword" type="checkbox" /> Показати пароль</label>
          <button class="secondary" type="submit" id="sharedSubmit">Увійти паролем відділення</button>
        </form>

        <small id="loginError" class="login-error" hidden></small>
      </div>
    </section>
    <script src="api.js?v=20260916j"></script>
    <script src="login.js?v=20260916j"></script>
  </body>
</html>
