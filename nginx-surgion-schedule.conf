# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name surgion-schedule.tereshkovych.com.ua imaging-schedule.tereshkovych.com.ua surgeon-schedule.tereshkovych.com.ua;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name surgion-schedule.tereshkovych.com.ua imaging-schedule.tereshkovych.com.ua surgeon-schedule.tereshkovych.com.ua;

    # Certbot підставить свої шляхи після: certbot --nginx ...
    # Або залиште ці рядки, якщо сертифікати вже в /etc/letsencrypt/live/<основний-домен>/
    ssl_certificate     /etc/letsencrypt/live/surgion-schedule.tereshkovych.com.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/surgion-schedule.tereshkovych.com.ua/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /usr/src/surgion_operation/Surgion_Operation_Schedule;
    index login.html index.html;
    client_max_body_size 512m;

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 512m;
        client_body_timeout 600s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
