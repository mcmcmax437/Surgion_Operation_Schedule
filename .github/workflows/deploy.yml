name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy static site
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          TARGET_PATH="${VPS_DEPLOY_PATH:-/usr/src/surgion_operation/Surgion_Operation_Schedule}"
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ]; then
            echo "Missing one of: VPS_HOST, VPS_USER"
            exit 1
          fi

          # Keep server-only files (.env, config.js) when syncing
          rsync -avz --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.env' \
            --exclude '.env.example' \
            --exclude 'config.js' \
            --exclude 'config.example.js' \
            --exclude 'README.md' \
            ./ "${VPS_USER}@${VPS_HOST}:${TARGET_PATH}/"

          # Build config.js from .env that already lives on the VPS
          ssh "${VPS_USER}@${VPS_HOST}" "python3 - \"$TARGET_PATH\"" <<'PY'
          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          env_path = root / ".env"
          if not env_path.is_file():
              raise SystemExit(f"Missing .env on server at {env_path}")

          password = None
          for raw in env_path.read_text(encoding="utf-8").splitlines():
              line = raw.strip()
              if not line or line.startswith("#") or "=" not in line:
                  continue
              key, value = line.split("=", 1)
              if key.strip() != "ACCESS_PASSWORD":
                  continue
              value = value.strip()
              if len(value) >= 2 and value[0] == value[-1] and value[0] in "'\"":
                  value = value[1:-1]
              password = value
              break

          if not password:
              raise SystemExit("ACCESS_PASSWORD is missing or empty in server .env")

          (root / "config.js").write_text(
              "window.APP_CONFIG = {\n"
              f"  ACCESS_PASSWORD: {json.dumps(password)},\n"
              "};\n",
              encoding="utf-8",
          )
          print("config.js generated from server .env")
          PY
