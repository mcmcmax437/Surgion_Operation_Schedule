name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy app
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          TARGET_PATH="${VPS_DEPLOY_PATH:-/usr/src/surgion_operation/Surgion_Operation_Schedule}"
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ]; then
            echo "Missing one of: VPS_HOST, VPS_USER"
            exit 1
          fi

          rsync -avz --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.env' \
            --exclude '.env.example' \
            --exclude 'config.js' \
            --exclude 'node_modules/' \
            --exclude 'uploads/' \
            --exclude 'README.md' \
            ./ "${VPS_USER}@${VPS_HOST}:${TARGET_PATH}/"

          ssh "${VPS_USER}@${VPS_HOST}" "bash -s" <<EOF
          set -euo pipefail
          cd "$TARGET_PATH"
          if [ ! -f .env ]; then
            echo "Missing .env on server at $TARGET_PATH/.env"
            exit 1
          fi
          npm install --omit=dev
          mkdir -p uploads
          if command -v pm2 >/dev/null 2>&1; then
            pm2 startOrReload ecosystem.config.cjs --update-env || pm2 start ecosystem.config.cjs
            pm2 save
          else
            echo "pm2 not found. Start API manually: npm start"
          fi
          EOF
